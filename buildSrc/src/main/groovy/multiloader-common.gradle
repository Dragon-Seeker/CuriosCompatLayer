plugins {
    id 'java-library'
    id 'maven-publish'
}

version = "${rootProject.version}-${rootProject.cc_layer_version}+${rootProject.minecraft_version}-${project.name}"
group = group

base {
    archivesName = "accessories_${cc_layer_mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

